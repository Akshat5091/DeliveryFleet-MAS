version: '3.8'

services:
  fleet-mas-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleet_mas_core
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_GENAI_USE_VERTEXAI=FALSE
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    restart: unless-stopped
    command: python demo.py

  mcp-tool-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleet_mcp_server
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command: python src/mcp/server.py

  phoenix-observability:
    image: arizephoenix/phoenix:latest
    container_name: fleet_phoenix_tracer
    ports:
      - "6006:6006"
    restart: unless-stopped

networks:
  default:
    name: fleet_agentic_net
